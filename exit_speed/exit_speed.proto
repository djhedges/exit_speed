// sudo apt install python3-protobuf
// Compile with protoc -I ./ --python_out ./ exit_speed.proto
syntax = "proto3";

import "google/protobuf/timestamp.proto";

// TODO(djhedges): Rename this package back to exit_speed after
// gps.proto is removed.
package exit_speed_refactor;

message Gps {
  google.protobuf.Timestamp time = 1;
  double lat = 2;
  double lon = 3;
  double alt = 4;
  double speed_ms = 5;  // meters/second
}

message Accelerometer {
  google.protobuf.Timestamp time = 1;
  double accelerometer_x = 2; // G forces.
  double accelerometer_y = 3; // G forces.
  double accelerometer_z = 4; // G forces.
}

message Ecu {
  google.protobuf.Timestamp time = 1;

  // Frame 1
  double rpm = 2;
  double map_psi = 3;
  double mgp_psi = 4;

  // Frame 2
  double barometric_pressure_psi = 5;
  double tps = 6;
  double injector_dc = 7;

  // Frame 3
  double injector_dc_sec = 8;
  double injector_pulse_width = 9;
  double ect_f = 10;

  // Frame 4
  double iat_f = 11;
  double ecu_volts = 12;
  double maf = 13;

  // Frame 5
  uint32 gear_position = 14; 
  double injector_timing = 15;
  double ignition_timing = 16;

  // Frame 6
  // double cam_inlet_bank_1 = 17;
  // double cam_inlet_bank_2 = 18;
  // double cam_exhaust_bank_1 = 19;

  // Frame 7
  // double cam_exhaust_bank_2 = 20;
  double lambda_1 = 21;
  // double lambda_2 = 22;

  // Frame 8
  uint32 trig_1_error_counter = 23;
  uint32 fault_codes = 24;
  double fuel_pressure_psi = 25;

  // Frame 9
  double oil_temp_f = 26;
  double oil_pressure_psi = 27;
  // double lf_wheel_speed = 28;

  // Frame 10
  // double lr_wheel_speed = 29;
  // double rf_wheel_speed = 30;
  // double rr_wheel_speed = 31;

  // Frame 11
  double knock_level_1 = 32;
  double knock_level_2 = 33;
  // double knock_level_3 = 34;

  // Frame 12
  // double knock_level_4 = 35;
  // double knock_level_5 = 36;
  // double knock_level_6 = 37;

  // Frame 13
  // double knock_level_7 = 38;
  // double knock_level_8 = 39;
  // uint32 limits_flags = 40; // Bit field

  // Frame 14
  // double aps_main = 41;
  // double percent_ethanol = 42;
  // uint32 status_bit_field = 43; // Bit field
}

message Gyroscope {
  google.protobuf.Timestamp time = 1;
  double gyro_x = 2; // Degrees/second
  double gyro_y = 3; // Degrees/second
  double gyro_z = 4; // Degrees/second
}

message Labjack {
  google.protobuf.Timestamp time = 1;
  double labjack_temp_f = 2;  // Labjack ambient temperature in Fahrenheit.
  double battery_voltage = 3;
  double front_brake_pressure_voltage = 4;
  double fuel_level_voltage = 5;
  double fuel_pressure_voltage = 6;
  double oil_pressure_voltage = 7;
  double oil_temp_voltage =  8;
  double rear_brake_pressure_voltage = 9;
  double water_temp_voltage = 10;
}

message WBO2 {
  google.protobuf.Timestamp time = 1;
  double afr = 2;  // Air fuel ratio.
  double rpm = 3;
  double tps_voltage = 4;  // Throttle position sensor voltage.
}

message TireIrSensors {
  google.protobuf.Timestamp time = 1;
  TireIrSensor lf_tire_temp = 2;  // Left Front
  TireIrSensor rf_tire_temp = 3;  // Right Front
  TireIrSensor lr_tire_temp = 4;  // Left Rear
  TireIrSensor rr_tire_temp = 5;  // Right Rear
}

message TireIrSensor {
  double inner = 1;
  double middle = 2;
  double outer = 3;
}
